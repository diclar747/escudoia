name: Build ESCUDO IA Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile test APKs
        working-directory: android
        run: gradle --no-daemon :app:assemblePlayDebug :app:assembleDirectDebug
      - uses: actions/upload-artifact@v4
        with:
          name: escudoia-play-debug
          path: android/app/build/outputs/apk/play/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: escudoia-direct-debug
          path: android/app/build/outputs/apk/direct/debug/*.apk
          if-no-files-found: error
