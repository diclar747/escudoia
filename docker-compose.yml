services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: escudo
      POSTGRES_USER: escudo
      POSTGRES_PASSWORD: local_development_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - escudo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escudo -d escudo"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  escudo_pg:
